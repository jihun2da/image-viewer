<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>제품 이미지 비교 뷰어 (반응형 최적화)</title>
    <style>
        /* 화면 전체를 유연하게 쓰도록 수정 */
        body { margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; background-color: #f0f2f5; display: flex; flex-direction: column; min-height: 100vh; }
        
        .header { background-color: #2c3e50; padding: 15px; text-align: center; }
        .upload-controls { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px dashed #7f8c8d; color: white; }
        .folder-input-label { display: inline-block; background-color: #27ae60; color: white; padding: 10px 30px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        .folder-input-label:hover { background-color: #2ecc71; }
        #folder-input { display: none; }
        .upload-status { margin-top: 10px; font-size: 14px; color: #bdc3c7; }
        
        .view-controls { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #455a64; display: flex; justify-content: center; gap: 15px; }
        .photo-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        
        .btn { border: none; padding: 8px 20px; border-radius: 5px; font-size: 15px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .photo-btn { background-color: #ecf0f1; color: #2c3e50; }
        .photo-btn:hover { background-color: #bdc3c7; }
        .photo-btn.active { background-color: #e74c3c; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .photo-btn:disabled { background-color: #7f8c8d; color: #bdc3c7; cursor: not-allowed; } 
        
        .toggle-btn { background-color: #f39c12; color: white; padding: 10px 30px; font-size: 16px; }
        .toggle-btn:hover { background-color: #e67e22; }
        .transform-btn { background-color: #9b59b6; color: white; padding: 10px 30px; font-size: 16px; }
        .transform-btn:hover { background-color: #8e44ad; }
        
        /* [핵심 수정 1] 좌우 여백을 줄이고, max-width 제한을 완전히 삭제하여 화면에 꽉 차게 확장 */
        .main-container { display: flex; flex: 1; padding: 15px; justify-content: center; overflow: hidden; width: 100%; box-sizing: border-box; }
        .view-frame { flex: 1; width: 100%; background-color: white; display: flex; flex-direction: column; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        
        h2 { text-align: center; font-size: 18px; color: #333; margin: 15px 0 0; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        
        /* [핵심 수정 2] 슬라이더 내부 영역을 유연하게 늘려줍니다 */
        .slider-wrap { position: relative; flex: 1; display: flex; align-items: center; justify-content: flex-start; overflow: hidden; width: 100%; height: 100%; }
        .slider-items { display: flex; width: 400%; height: 100%; flex-shrink: 0; transition: transform 0.4s ease-out; }
        .comparison-item { width: 25%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; position: relative; background-color: #fafafa; }
        
        .no-image-text { color: #95a5a6; font-size: 16px; text-align: center; }
        .style-badge { position: absolute; top: 25px; left: 25px; background-color: rgba(52, 73, 94, 0.9); color: white; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; z-index: 2; }
        
        /* [핵심 수정 3] 사진이 가로 100%를 차지하되, 세로가 모니터 높이(85vh)를 넘지 않도록 브라우저가 자동 조절 */
        .comparison-item img { width: 100%; height: 85vh; object-fit: contain; border-radius: 6px; }
        
        .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); background-color: rgba(0, 0, 0, 0.4); color: white; border: none; width: 60px; height: 60px; border-radius: 50%; font-size: 28px; font-weight: bold; cursor: pointer; z-index: 10; transition: background-color 0.2s; }
        .slider-btn:hover { background-color: rgba(0, 0, 0, 0.8); }
        .prev-btn { left: 20px; } .next-btn { right: 20px; }
        
        /* 바둑판 모드일 때는 세로 스크롤이 생기도록 자동 높이 지정 */
        .view-frame.grid-mode .slider-wrap { overflow-y: auto; align-items: flex-start; }
        .view-frame.grid-mode .slider-items { width: 100%; height: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; box-sizing: border-box; transform: translateX(0) !important; transition: none; }
        .view-frame.grid-mode .comparison-item { width: 100%; height: auto; padding: 0; }
        .view-frame.grid-mode .comparison-item img { height: auto; max-height: 70vh; }
        .view-frame.grid-mode .slider-btn { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <div class="upload-controls">
            <label for="folder-input" class="folder-input-label">📁 PC에서 'images' 폴더 선택하기</label>
            <input type="file" id="folder-input" webkitdirectory directory multiple onchange="handleFolderSelect(event)">
            <div class="upload-status" id="upload-status-text">아직 폴더가 선택되지 않았습니다.</div>
        </div>
        <div class="view-controls">
            <button class="btn toggle-btn" id="toggle-view-btn" onclick="toggleViewMode()">전체 바둑판 보기</button>
            <button class="btn transform-btn" id="toggle-ext-btn" onclick="toggleExtension()">수정본 보기 (.png)</button>
        </div>
        <div class="photo-controls">
            <button class="btn photo-btn" id="btn-1" onclick="changePhoto(1)" disabled>사진 1</button>
            <button class="btn photo-btn" id="btn-2" onclick="changePhoto(2)" disabled>사진 2</button>
            <button class="btn photo-btn" id="btn-3" onclick="changePhoto(3)" disabled>사진 3</button>
            <button class="btn photo-btn" id="btn-4" onclick="changePhoto(4)" disabled>사진 4</button>
            <button class="btn photo-btn" id="btn-5" onclick="changePhoto(5)" disabled>사진 5</button>
            <button class="btn photo-btn" id="btn-6" onclick="changePhoto(6)" disabled>사진 6</button>
            <button class="btn photo-btn" id="btn-7" onclick="changePhoto(7)" disabled>사진 7</button>
            <button class="btn photo-btn" id="btn-8" onclick="changePhoto(8)" disabled>사진 8</button>
            <button class="btn photo-btn" id="btn-9" onclick="changePhoto(9)" disabled>사진 9</button>
            <button class="btn photo-btn" id="btn-10" onclick="changePhoto(10)" disabled>사진 10</button>
        </div>
    </div>
    <div class="main-container">
        <div class="view-frame main-view">
            <h2>메인 이미지 뷰어</h2>
            <div class="slider-wrap">
                <button class="slider-btn prev-btn" onclick="prevStyle()">&#10094;</button>
                <button class="slider-btn next-btn" onclick="nextStyle()">&#10095;</button>
                <div id="main-slider-items" class="slider-items">
                    <div style="width: 100%; display: flex; justify-content: center; align-items: center; color: #7f8c8d; font-size: 18px; font-weight: bold;">
                        상단의 초록색 버튼을 눌러 촬영 원본이 있는 폴더를 선택해 주세요.
                    </div>
                </div> 
            </div>
        </div>
    </div>
    <script>
        let currentPhotoNum = 1; 
        let currentStyleIndex = 0; 
        let isGridView = false; 
        let isModifiedMode = false; 
        let localFilesDb = { 'style1': {}, 'style2': {}, 'style3': {}, 'style4': {} };

        function handleFolderSelect(event) {
            const files = event.target.files;
            if (files.length === 0) return;

            localFilesDb = { 'style1': {}, 'style2': {}, 'style3': {}, 'style4': {} };
            let loadedCount = 0;

            for(let i = 0; i < files.length; i++) {
                const file = files[i];
                const path = file.webkitRelativePath.toLowerCase(); 
                const fileName = file.name.toLowerCase(); 

                if(path.includes('style1/')) { localFilesDb['style1'][fileName] = URL.createObjectURL(file); loadedCount++; }
                else if(path.includes('style2/')) { localFilesDb['style2'][fileName] = URL.createObjectURL(file); loadedCount++; }
                else if(path.includes('style3/')) { localFilesDb['style3'][fileName] = URL.createObjectURL(file); loadedCount++; }
                else if(path.includes('style4/')) { localFilesDb['style4'][fileName] = URL.createObjectURL(file); loadedCount++; }
            }

            document.getElementById('upload-status-text').innerText = `성공적으로 ${loadedCount}개의 사진을 인식했습니다! (반응형 최적화됨)`;
            
            for(let i = 1; i <= 10; i++) {
                document.getElementById('btn-' + i).disabled = false;
            }
            changePhoto(1);
        }

        function toggleExtension() {
            isModifiedMode = !isModifiedMode; 
            const extBtn = document.getElementById('toggle-ext-btn');
            if(isModifiedMode) {
                extBtn.innerText = "현재 상태: 수정본 (.png) - 원본으로 돌아가기";
                extBtn.style.backgroundColor = "#c0392b"; 
            } else {
                extBtn.innerText = "수정본 보기 (.png)";
                extBtn.style.backgroundColor = "#9b59b6"; 
            }
            changePhoto(currentPhotoNum); 
        }

        function changePhoto(photoNum) {
            currentPhotoNum = photoNum; 
            currentStyleIndex = 0; 
            
            for(let i = 1; i <= 10; i++) { document.getElementById('btn-' + i).classList.remove('active'); }
            document.getElementById('btn-' + photoNum).classList.add('active');
            
            let imagesHtml = '';
            const fileExtension = isModifiedMode ? 'png' : 'jpg';
            const targetFileName = `${photoNum}.${fileExtension}`; 

            for(let style = 1; style <= 4; style++) {
                const styleKey = `style${style}`;
                const imgSrc = localFilesDb[styleKey][targetFileName] || ''; 
                
                if (imgSrc) {
                    imagesHtml += `<div class="comparison-item"><div class="style-badge">스타일 ${style}</div><img src="${imgSrc}" alt="사진 ${photoNum} 스타일 ${style}"></div>`;
                } else {
                    imagesHtml += `<div class="comparison-item"><div class="style-badge">스타일 ${style}</div><div class="no-image-text">해당 파일이<br>폴더에 없습니다.<br>(${targetFileName})</div></div>`;
                }
            }
            
            document.getElementById('main-slider-items').innerHTML = imagesHtml;
            if(!isGridView) { updateSliders(true); }
        }

        function toggleViewMode() {
            isGridView = !isGridView;
            const mainView = document.querySelector('.main-view');
            const toggleBtn = document.getElementById('toggle-view-btn');
            if(isGridView) {
                mainView.classList.add('grid-mode');
                toggleBtn.innerText = "한 장씩 슬라이드로 보기";
                toggleBtn.style.backgroundColor = "#27ae60"; 
            } else {
                mainView.classList.remove('grid-mode');
                toggleBtn.innerText = "전체 바둑판 보기";
                toggleBtn.style.backgroundColor = "#f39c12"; 
                updateSliders(true); 
            }
        }

        function prevStyle() { if(isGridView) return; currentStyleIndex = (currentStyleIndex - 1 + 4) % 4; updateSliders(); }
        function nextStyle() { if(isGridView) return; currentStyleIndex = (currentStyleIndex + 1) % 4; updateSliders(); }
        
        function updateSliders(immediate = false) {
            const offset = currentStyleIndex * 25; 
            const mainSlider = document.getElementById('main-slider-items'); 
            if(immediate) { mainSlider.style.transition = 'none'; } 
            else { mainSlider.style.transition = 'transform 0.4s ease-out'; }
            mainSlider.style.transform = `translateX(-${offset}%)`;
        }
    </script>
</body>
</html>
